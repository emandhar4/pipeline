name: Finder

# Daily at 10:17 UTC (off the hour, when GitHub delays cron jobs), plus manual runs.
# Scheduled runs use the default branch and the input defaults below.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated scopes, e.g. simplify,greenhouse:stripe (empty = everything)'
        required: false
        type: string
        default: ''
      resolve_limit:
        description: 'Max unknown companies to probe this run'
        required: false
        type: string
        default: '150'

permissions:
  contents: read

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  finder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run finder
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Inputs go through env, never inline in the script.
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_RESOLVE_LIMIT: ${{ inputs.resolve_limit }}
        run: |
          set -euo pipefail
          trigger=manual
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then trigger=schedule; fi
          args=(--resolve-limit "${INPUT_RESOLVE_LIMIT:-150}" --trigger "$trigger")
          if [ -n "${INPUT_ONLY// /}" ]; then
            args+=(--only "$INPUT_ONLY")
          fi
          npx tsx scripts/finder.ts "${args[@]}"
